# /etc/nginx/sites-available/englishst  →  ln -s в sites-enabled (соседние сайты не трогаем)
# После проверки DNS (A-записи всех четырёх имён на IP сервера):
#   sudo certbot --nginx -d english-st.ru -d www.english-st.ru -d english-st.online -d www.english-st.online
# certbot добавит HTTPS и редирект с http на https в каждый server-блок ниже.

# Лимиты считаются только для POST (для остальных методов ключ пустой — nginx их не ограничивает),
# чтобы обычное открытие/обновление страницы входа не упиралось в «5 в минуту».
map $request_method $englishst_post_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $englishst_post_key zone=englishst_login:10m rate=20r/m;
# Вход: 20 в минуту с IP, а не 5: весь класс (~15 детей) сидит за одним Wi-Fi школы и входит одновременно.
# Подбор пароля дополнительно ограничивает login_guard приложения (по логину).
# Загрузка аватара держит до 10 МБ в памяти, пока ждёт очереди на декодирование
limit_req_zone $englishst_post_key zone=englishst_upload:10m rate=6r/m;
# Формы вопросов (с картинками и без): учитель правит пачку вопросов подряд, а классы сидят за одним Wi-Fi,
# поэтому лимит свободнее, чем у аватаров
limit_req_zone $englishst_post_key zone=englishst_editor:10m rate=30r/m;

upstream englishst_app {
    server 127.0.0.1:8002;
}

# english-st.online и www.english-st.online → основной адрес
server {
    listen 80;
    server_name english-st.online www.english-st.online;
    return 301 https://english-st.ru$request_uri;
}

# www.english-st.ru → без www
server {
    listen 80;
    server_name www.english-st.ru;
    return 301 https://english-st.ru$request_uri;
}

server {
    listen 80;
    server_name english-st.ru;

    client_max_body_size 11m;  # аватар до 10 МБ + поля формы (вопросы с картинками — ниже, свой лимит)

    # Превышение лимита частоты: 429 (а не 503) со страницей на русском
    limit_req_status 429;
    error_page 429 /429.html;
    location = /429.html {
        internal;
        alias /srv/englishst/app/static/429.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    # add_header в location отменяет унаследованные заголовки сервера — поэтому в location /admin они повторены
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    # Статику отдаёт nginx, Python не трогаем
    location /static/ {
        alias /srv/englishst/app/static/;
        expires 30d;
        access_log off;
    }

    # Загруженные файлы (фото детей) публично не отдаются: публичного /media/ нет.
    # Приложение проверяет права и отвечает заголовком X-Accel-Redirect: /_protected/<путь>,
    # после чего файл отдаёт nginx. Снаружи этот адрес недоступен (internal).
    location /_protected/ {
        internal;
        alias /srv/englishst/media/;
    }

    location = /login {
        limit_req zone=englishst_login burst=20 nodelay;
        include /etc/nginx/proxy_params;  # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
        proxy_pass http://englishst_app;
    }

    # Загрузка аватара: свой и учителем ученика. «/avatar/delete» и прочие адреса сюда не попадают ($).
    location ~ ^/(profile/avatar|teacher/students/[0-9]+/avatar)$ {
        limit_req zone=englishst_upload burst=3 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://englishst_app;
    }

    # Сохранение вопроса (в пуле или прямо в тесте): до 5 картинок (вопрос + 4 варианта), каждая до 10 МБ
    location ~ ^/tasks/((pools|tests)/[0-9]+/questions|questions/[0-9]+)$ {
        client_max_body_size 52m;
        limit_req zone=englishst_editor burst=10 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://englishst_app;
    }

    # Заготовка для чата (этап 3): сейчас такого маршрута в приложении нет
    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/proxy_params;
        proxy_pass http://englishst_app;
    }

    # Админка sqladmin (только admin, проверяет приложение). Её шаблоны содержат встроенный <script>
    # (всплывающие уведомления после сохранения), поэтому для /admin CSP мягче: разрешён inline-скрипт.
    # Остальной сайт остаётся со строгой CSP без скриптов inline.
    location ^~ /admin {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        include /etc/nginx/proxy_params;
        proxy_pass http://englishst_app;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://englishst_app;
    }
}
